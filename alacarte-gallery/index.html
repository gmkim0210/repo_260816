<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A La Carte Da Nang Beach — 사진 미리보기</title>
  <meta name="description" content="다낭 가족 여행용 A La Carte Da Nang Beach 호텔 사진 미리보기. 키즈클럽, 풀, 해변, 패밀리 스위트." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__media" aria-hidden="true">
      <img
        src="https://alacartedanangbeach.com/wp-content/uploads/2024/05/Experience-summer-vacation-at-A-La-Carte-Danang-Beach-1-.jpg"
        alt=""
        fetchpriority="high"
      />
      <div class="hero__veil"></div>
    </div>
    <div class="hero__content">
      <p class="brand">À La Carte Da Nang Beach</p>
      <h1>사진 미리보기</h1>
      <p class="lede">미케 비치 앞 가족 숙소 — 풀 · 바다 · 2BR 스위트를 한눈에.</p>
      <div class="cta-row">
        <a class="cta" href="#gallery">사진 둘러보기</a>
        <a class="cta cta--ghost" href="https://alacartedanangbeach.com/en/" target="_blank" rel="noopener noreferrer">공식 사이트</a>
      </div>
    </div>
  </header>

  <nav class="filters" id="gallery" aria-label="사진 카테고리">
    <button type="button" class="filter is-active" data-filter="all">전체</button>
    <button type="button" class="filter" data-filter="pool">풀</button>
    <button type="button" class="filter" data-filter="beach">해변</button>
    <button type="button" class="filter" data-filter="kids">키즈</button>
    <button type="button" class="filter" data-filter="room">객실</button>
    <button type="button" class="filter" data-filter="lobby">로비·외관</button>
  </nav>

  <main class="gallery">
    <figure class="shot shot--wide" data-cat="pool" style="--d:0">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/08/ALCDN-Pool-1.webp" alt="루프탑 인피니티 풀과 미케 비치 전망" />
      <figcaption>루프탑 인피니티 풀 · 손짜 반도가 보이는 오션뷰</figcaption>
    </figure>

    <figure class="shot" data-cat="pool" style="--d:1">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/06/ho-boi-vo-cuc-a-la-carte-danang-beach-1.jpg" alt="인피니티 풀 와이드샷" />
      <figcaption>옥상 풀에서 이어지는 바다 수평선</figcaption>
    </figure>

    <figure class="shot" data-cat="pool" style="--d:2">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/08/ALCDN-Pool-2.webp" alt="인피니티 풀 데크" />
      <figcaption>풀사이드 데크 — 느긋한 휴식</figcaption>
    </figure>

    <figure class="shot shot--tall" data-cat="beach" style="--d:3">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/08/du-lich-da-nang-bai-bien-my-khe-tho-mong.jpg" alt="미케 비치와 야자수" />
      <figcaption>호텔 앞에서 내려다본 미케 비치</figcaption>
    </figure>

    <figure class="shot" data-cat="beach" style="--d:4">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/05/Experience-summer-vacation-at-A-La-Carte-Danang-Beach-3.jpg" alt="일출의 루프탑 풀" />
      <figcaption>일출빛 머금은 루프탑 풀</figcaption>
    </figure>

    <figure class="shot" data-cat="kids" style="--d:5">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/05/Experience-summer-vacation-at-A-La-Carte-Danang-Beach-6.jpg" alt="키즈 클럽 놀이 공간" />
      <figcaption>2층 키즈 클럽 — 장난감·놀이 공간</figcaption>
    </figure>

    <figure class="shot shot--wide" data-cat="room" style="--d:6">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2023/10/Highlight-Plus-Ocean-view2.webp" alt="Highlight Plus 오션뷰 거실과 주방" />
      <figcaption>Highlight Plus Ocean View (2BR · 115㎡) — 거실·다이닝·키친ette</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:7">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2023/10/Highlight-Plus-Ocean-view.webp" alt="Highlight Plus 침실" />
      <figcaption>패밀리 스위트 침실 — 밝고 미니멀</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:8">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2023/10/Highlight-Ocean-view-Two-bedroom-Ocean-view-Suite-with-balcony-1-1.webp" alt="2베드룸 오션뷰 스위트" />
      <figcaption>Highlight Ocean View 2BR — 침실 분리형</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:9">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2023/10/Highlight-Plus-Ocean-view3.webp" alt="스위트 거실 오션뷰" />
      <figcaption>바다를 품은 넓은 거실</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:10">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2023/10/Outside-1.webp" alt="호텔 외관" />
      <figcaption>외관 — 보이응우옌잡 해안도로 코너</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:11">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/08/ALCDN-Lobby-3.webp" alt="호텔 로비" />
      <figcaption>밝고 개방적인 로비</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:12">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/08/ALCDN-Lobby-2.webp" alt="로비 라운지" />
      <figcaption>체크인 · 라운지 공간</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:13">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2024/05/Experience-summer-vacation-at-A-La-Carte-Danang-Beach-7.jpg" alt="델리 카페" />
      <figcaption>로비층 DELI 카페·베이커리</figcaption>
    </figure>

    <figure class="shot shot--wide" data-cat="beach" style="--d:14">
      <img loading="lazy" src="https://alacartedanangbeach.com/wp-content/uploads/2023/09/DSC02313-Edit-scaled.jpg" alt="오션뷰 발코니" />
      <figcaption>객실 발코니에서 바라본 바다</figcaption>
    </figure>
  </main>

  <footer class="foot">
    <p class="note">Images: hotel / OTA public listing — for trip planning preview</p>
    <p class="sources">출처: <a href="https://alacartedanangbeach.com/en/thu-vien/" target="_blank" rel="noopener noreferrer">alacartedanangbeach.com</a> 공식 갤러리·숙소 페이지 공개 이미지. 예약·요금은 공식/OTA에서 확인하세요.</p>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="확대 보기">
    <button type="button" class="lightbox__close" aria-label="닫기">×</button>
    <img alt="" />
    <p class="lightbox__cap"></p>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
