<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Richico Apartment &amp; Hotel — 사진 미리보기</title>
  <meta name="description" content="다낭 My Khe 인근 Richico Apartment & Hotel 사진 미리보기. 키즈풀, 2BR 아파트, 루프탑 풀." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__media" aria-hidden="true">
      <img
        src="https://richicohotel.com/wp-content/uploads/2022/10/62f270808e52400c1943-copy.jpg"
        alt=""
        fetchpriority="high"
      />
      <div class="hero__veil"></div>
    </div>
    <div class="hero__content">
      <p class="brand">Richico Apartment &amp; Hotel</p>
      <h1>사진 미리보기</h1>
      <p class="lede">미케 비치 도보권 · 키즈풀 · 2BR 아파트 — 가족 여행용 미리보기.</p>
      <div class="cta-row">
        <a class="cta" href="#gallery">사진 둘러보기</a>
        <a class="cta cta--ghost" href="https://richicohotel.com/" target="_blank" rel="noopener noreferrer">공식 사이트</a>
      </div>
    </div>
  </header>

  <nav class="filters" id="gallery" aria-label="사진 카테고리">
    <button type="button" class="filter is-active" data-filter="all">전체</button>
    <button type="button" class="filter" data-filter="pool">풀</button>
    <button type="button" class="filter" data-filter="kids">키즈</button>
    <button type="button" class="filter" data-filter="room">2BR·아파트</button>
    <button type="button" class="filter" data-filter="lobby">로비·외관</button>
    <button type="button" class="filter" data-filter="beach">해변 근접</button>
  </nav>

  <main class="gallery">
    <figure class="shot shot--wide" data-cat="pool kids" style="--d:0">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/62f270808e52400c1943-copy.jpg" alt="루프탑 야외 수영장과 바다 전망" />
      <figcaption>루프탑 야외 풀 · 오션뷰 데크 — 키즈풀·플레이그라운드는 OTA 표기 (전용 컷 미확인)</figcaption>
    </figure>

    <figure class="shot shot--tall" data-cat="beach" style="--d:1">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/3a9f2020def210ac49e3.jpg" alt="발코니에서 본 미케 비치 방향" />
      <figcaption>객실 발코니에서 미케 비치 방향 (~650–700m)</figcaption>
    </figure>

    <figure class="shot shot--wide" data-cat="room" style="--d:3">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2017/08/head-tien-nghi-scaled.jpg" alt="2베드룸 아파트 내부 파노라마" />
      <figcaption>2BR 아파트 — 침실 분리 · 거실·발코니 연결</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:4">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/dai-dien-ch2pn.jpg" alt="2베드룸 아파트 대표 사진" />
      <figcaption>Căn hộ 2 phòng ngủ — 공식 대표컷</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:5">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2017/06/can-ho-2-phong-ngu-7.jpg" alt="2BR 거실·다이닝·키친ette" />
      <figcaption>거실·다이닝·키친ette — 가족 체류형</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:6">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2017/06/can-ho-2-phong-ngu-2.jpg" alt="2BR 거실과 소파" />
      <figcaption>2BR 거실 — TV·냉장고·세탁기 갖춤</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:7">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/can-ho-2-phong-ngu-3.jpg" alt="주방과 세탁기" />
      <figcaption>주방 카운터 · 세탁기 — 장기 체류에 유리</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:8">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/can-ho-2-phong-ngu-9.jpg" alt="2BR 침실" />
      <figcaption>분리된 침실 — 라임 그린 포인트</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:9">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/dai-dien.jpg" alt="모던 침실" />
      <figcaption>깔끔한 모던 침실 스타일</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:10">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/a1-ve.jpg" alt="야간 호텔 외관" />
      <figcaption>외관 야경 — 176–178 Nguyễn Văn Thoại</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:11">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/z3812717364893_e8346f6bf3cb6a36ea48a18b8fa75cde.jpg" alt="로비 카페 리셉션" />
      <figcaption>로비 · Richico Cafe 리셉션</figcaption>
    </figure>

    <figure class="shot" data-cat="lobby" style="--d:12">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/z3812706710940_67545d8c4ec5bbe4fa43c30b36843ad9.jpg" alt="조식 뷔페" />
      <figcaption>조식 뷔페 공간</figcaption>
    </figure>

    <figure class="shot" data-cat="room" style="--d:13">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2017/06/cb1.jpg" alt="욕실" />
      <figcaption>모던 욕실 · 레인샤워</figcaption>
    </figure>

    <figure class="shot shot--wide" data-cat="beach" style="--d:14">
      <img loading="lazy" src="https://richicohotel.com/wp-content/uploads/2022/10/278640102_5048336941914596_4472345227348512849_n.jpg" alt="시티뷰 침실" />
      <figcaption>밝은 객실 · My An / My Khe 생활권</figcaption>
    </figure>
  </main>

  <footer class="foot">
    <p class="note">Images: hotel / OTA public listing — for trip planning preview</p>
    <p class="sources">출처: <a href="https://richicohotel.com/" target="_blank" rel="noopener noreferrer">richicohotel.com</a> 공식 미디어. 키즈풀은 OTA(Expedia 등) 표기 기준 · 전용 컷은 공식 갤러리에서 미확인. 예약·요금은 공식/OTA에서 확인하세요.</p>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="확대 보기">
    <button type="button" class="lightbox__close" aria-label="닫기">×</button>
    <img alt="" />
    <p class="lightbox__cap"></p>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
